# YOLO11 object detection model with P2-P5 outputs (added P2 head)
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512]  # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512]  # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512]  # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ADown, [256]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ADown, [512]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, ADown, [1024]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10

# YOLO11 head with P2 branch
head:
  - [-1, 1, Conv, [256, 1, 1]]                         # 11, Y5 lateral_convs.0
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]

  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]      # 13 input_proj.1 (P4)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                       # 15, fpn_blocks.0 (P4 FPN)
  - [-1, 1, Conv, [256, 1, 1]]                        # 16, Y4 lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]      # 18 input_proj.0 (P3)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                       # 20, fpn_blocks.1 (P3 FPN) -> X3

  # -------- P2 branch added --------
  - [-1, 1, Conv, [128, 1, 1]]                        # 21, adjust channel for P2 path
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]      # 23 input_proj for P2 (from backbone P2)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]                       # 25, P2 detection feature (X2)

  # -------- New PAN downward path (P3) --------
  - [-1, 1, Conv, [256, 3, 2]]                        # 26, downsample from P2
  - [[-1, 20], 1, Concat, [1]]                        # cat with X3 (P3 FPN)
  - [-1, 2, C3k2, [256, False]]                       # 28, new P3 detection feature

  # -------- New PAN downward path (P4) --------
  - [-1, 1, Conv, [256, 3, 2]]                        # 29, downsample from new P3
  - [[-1, 15], 1, Concat, [1]]                        # cat with P4 FPN (15)
  - [-1, 2, C3k2, [256, False]]                       # 31, new P4 detection feature



  # -------- Detect layer (P2, P3, P4, P5) --------
  - [[25, 28, 31], 1, Detect, [nc]]               # Detect(P2, P3, P4, P5)