# Ultralytics YOLO 🚀, AGPL-3.0 license
# Light YOLO11n for pedestrian detection
# Goal: lighter than baseline, try to improve small pedestrian performance

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, Conv, [192, 1, 1]] # 11, reduce Y5 width
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  - [6, 1, Conv, [192, 1, 1, None, 1, 1, False]] # 13
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, False]] # 15, lighter FPN block
  - [-1, 1, Conv, [192, 1, 1]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [4, 1, Conv, [192, 1, 1, None, 1, 1, False]] # 18
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, False]] # 20, P3

  - [-1, 1, Conv, [192, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, False]] # 23, P4

  - [-1, 1, Conv, [192, 3, 2]] # 24
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, True]] # 26, P5

  - [[20, 23, 26], 1, Detect, [nc]] # Detect(P3, P4, P5)
