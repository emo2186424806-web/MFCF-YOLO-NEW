nc: 1 # 只检测行人
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ───────────────────────────────────────────
# Backbone
# ───────────────────────────────────────────
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  P2特征
  - [-1, 1, Conv, [256, 3, 2]] # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  P3特征 ← 小目标关键层
  - [-1, 1, Conv, [512, 3, 2]] # 5  P4/16
  - [-1, 2, C3k2, [512, True]] # 6  P4特征
  - [-1, 1, Conv, [1024, 3, 2]] # 7  P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9  多尺度池化
  - [-1, 1, CBAM, []] # 10 P5语义注意力（改进1）
  - [-1, 2, C2PSA, [1024]] # 11 全局上下文

# ───────────────────────────────────────────
# Neck（BiFPN风格双向融合）
# ───────────────────────────────────────────
head:
  # ── Top-Down 路径 ──────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12  P5→P4尺寸
  - [[-1, 6], 1, Concat, [1]] # 13  融合P4
  - [-1, 2, C3k2, [512, False]] # 14  P4融合特征
  - [-1, 1, CBAM, []] # 15  P4注意力

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16  P4→P3尺寸
  - [[-1, 4], 1, Concat, [1]] # 17  融合P3
  - [-1, 2, C3k2, [256, False]] # 18  P3融合特征
  - [-1, 1, CBAM, []] # 19  P3注意力 ★核心改进2

  # ── 额外引入P2超小目标分支 ─────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20  P3→P2尺寸
  - [[-1, 2], 1, Concat, [1]] # 21  融合P2原始特征
  - [-1, 2, C3k2, [128, False]] # 22  P2检测特征（改进3）

  # ── Bottom-Up 路径（BiFPN回路）─────────
  - [-1, 1, Conv, [128, 3, 2]] # 23  P2→P3
  - [[-1, 19], 1, Concat, [1]] # 24  融合增强P3
  - [-1, 2, C3k2, [256, False]] # 25  P3最终特征 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 26  P3→P4
  - [[-1, 15], 1, Concat, [1]] # 27  融合增强P4
  - [-1, 2, C3k2, [512, False]] # 28  P4最终特征 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 29  P4→P5
  - [[-1, 11], 1, Concat, [1]] # 30  融合P5
  - [-1, 2, C3k2, [1024, True]] # 31  P5最终特征 (P5/32)

  # ── 四尺度检测头 ───────────────────────
  - [[22, 25, 28, 31], 1, Detect, [nc]] # 改进4: P2+P3+P4+P5
